# Generated by Azure (az webapp deployment github-actions add), then pointed at the scheduler's folder.
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Node.js app to Azure Web App: contoso-dental-scheduler-f80d'

on:
  push:
    branches:
    - master
    paths:
    - 'starter/ContosoDentistryScheduler/**'
    - '.github/workflows/master_contoso-dental-scheduler-f80d.yml'
  workflow_dispatch:

env:
  APP_PATH: starter/ContosoDentistryScheduler

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: npm install, build, and test
      run: |
        npm ci --omit=dev
        npm run build --if-present
        npm run test --if-present

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'contoso-dental-scheduler-f80d'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_ee791e79423c46c39b89f6cbcb2708fb }}
        package: ${{ env.APP_PATH }}

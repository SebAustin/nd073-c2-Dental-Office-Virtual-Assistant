# Generated by Azure (az webapp deployment github-actions add), then pointed at the bot's folder.
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Node.js app to Azure Web App: contoso-dental-bot-app-f80d'

on:
  push:
    branches:
    - master
    paths:
    - 'starter/ContosoDentistryChatBot/**'
    - '.github/workflows/master_contoso-dental-bot-app-f80d.yml'
  workflow_dispatch:

env:
  APP_PATH: starter/ContosoDentistryChatBot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_PATH }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: ${{ env.APP_PATH }}/package-lock.json

    - name: npm install, build, and test
      run: |
        npm ci
        npm run build --if-present
        npm run test:coverage

    - name: Keep only production dependencies
      run: npm prune --omit=dev

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'contoso-dental-bot-app-f80d'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_e382690f92654cbe86be11a57a981ede }}
        package: ${{ env.APP_PATH }}
